<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff login · Smart Canteen</title><link rel="stylesheet" href="../css/style.css"></head><body class="admin">
<div class="auth" style="grid-template-columns:1fr"><main><form class="card" id="adminLoginForm" style="color:var(--ink)"><h2>Staff login</h2><p>Kitchen and counter staff only.</p>
<label for="identifier">Admin email</label><input id="identifier" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<p class="err" id="error" role="alert"></p><button class="btn alt block" type="submit">Log in to dashboard</button></form></main></div></body></html>
